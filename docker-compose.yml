services:
  pccampapp-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pccampapp-dev
    ports:
      - "${DEV_PORT:-5173}:5173"
    environment:
      - VOTING_ADMIN_KEY=${VOTING_ADMIN_KEY:-change-me-in-production}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-localhost}
    volumes:
      # Code live-reloadable aus src/
      - ./src:/usr/share/nginx/html:rw
      # Persistenter Content (JSONs, Voting-Daten, Hash-Manifest)
      - ./content:/usr/share/nginx/html/content:rw
      # Seeds fuer Erst-Initialisierung eines leeren content/
      - ./seed:/app/seed:ro
      # Dev-nginx-Config
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Security-Header-Include (nginx.conf inkludiert es auf Server-Ebene)
      - ./nginx.security-headers.conf:/etc/nginx/nginx.security-headers.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - pccampapp-network

networks:
  pccampapp-network:
    driver: bridge
