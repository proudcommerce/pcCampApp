# Dev-Container laeuft ebenfalls als nginx-User, siehe docker-entrypoint.sh.
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Admin-Uploads (logo/floorplan/sponsor-logo) bis 5 MB.
    client_max_body_size 5m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 5173;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.php;

        # Security-Header auf Server-Ebene. Jede Location mit eigenen add_header
        # MUSS die Include-Datei erneut laden — nginx vererbt add_header nicht.
        include /etc/nginx/nginx.security-headers.conf;

        # Disable caching for development
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # Content volume (host-mounted): admin-edited JSONs, sponsor logos,
        # floorplan image, sw-version.txt. `^~` verhindert, dass die
        # Regex-Locations fuer .json/.png/.jpg das Matching uebernehmen.
        # Nested-Regex-Locations blocken .backup/.dotfile — sonst wuerde `^~`
        # die aeusseren Deny-Regeln kurzschliessen.
        location ^~ /content/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires 0;
            include /etc/nginx/nginx.security-headers.conf;

            location ~ /\. {
                return 404;
                access_log off;
                log_not_found off;
            }

            location ~ \.backup$ {
                return 404;
                access_log off;
                log_not_found off;
            }

            # votes.json enthaelt User-Tracking — Aggregat laeuft ueber
            # /votes/status.php, Rohdatei bleibt intern.
            location = /content/voting/votes.json {
                return 404;
                access_log off;
                log_not_found off;
            }

            try_files $uri =404;
        }

        # Dev-Mode: assets-hashes.json existiert nur im Prod-Build. Liefere einen
        # leeren Stub, damit resolveAsset() auf Original-Dateinamen zurueckfaellt
        # ohne Konsolen-404.
        location = /assets-hashes.json {
            add_header Content-Type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
            return 200 '{}';
        }

        # Admin panel - rewrite directory URL to index.php for PHP-FPM
        location = /admin/ {
            rewrite ^(.*)$ /admin/index.php last;
        }

        # PWA-Icons + Favicon: Admin-Upload generiert Runtime-Varianten in
        # /content/assets/, die hier Vorrang vor dem src-Default bekommen.
        location = /assets/favicon.png {
            try_files /content$uri $uri =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }
        location = /assets/icon-144.png {
            try_files /content$uri $uri =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }
        location = /assets/icon-192.png {
            try_files /content$uri $uri =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }
        location = /assets/icon-512.png {
            try_files /content$uri $uri =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }

        # SPA Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static Assets
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }

        # JSON Files
        location ~* \.json$ {
            add_header Content-Type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }

        # Service Worker
        location = /sw.js {
            add_header Content-Type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Service-Worker-Allowed "/";
            include /etc/nginx/nginx.security-headers.conf;
        }

        # Deny access to hidden files and backup artifacts
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ \.backup$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # PHP files (for votes system)
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            # Disable caching for PHP responses
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }
    }
}
