# Security-Header fuer alle Responses.
#
# nginx vererbt add_header-Direktiven NICHT in Locations, die eigene add_header
# setzen. Darum muss dieses Snippet in jede Location inkludiert werden, die
# andere add_header definiert (z.B. Cache-Control, Content-Type-Overrides).
# Server-weite Definition reicht alleine NICHT aus.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
