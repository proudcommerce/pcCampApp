# Master laeuft als root (damit er Ports + /dev/stderr oeffnen kann),
# Worker wechseln in den nginx-User.
user nginx;
worker_processes auto;
# Logs gehen nach stdout/stderr — verhindert Permission-Issues mit /var/log/nginx
# im non-root-Container und ermoeglicht standardisiertes Docker-Log-Routing.
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Admin-Uploads (logo/floorplan/sponsor-logo) bis 5 MB.
    client_max_body_size 5m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 5173;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.php index.html;

        # Hinter Apache-Reverse-Proxy: nginx darf keine absoluten Redirects mit
        # seinem internen Listen-Port bauen (z.B. /admin -> /admin/ auf :5173).
        # Relative Redirects lassen den Browser den Origin (https://host) selbst
        # ergaenzen und die X-Forwarded-* Header sichtbar werden.
        absolute_redirect off;

        # Security-Header auf Server-Ebene. Jede Location, die eigene add_header
        # setzt, MUSS nginx.security-headers.conf erneut inkludieren — sonst
        # verliert sie diese Header (kein Inheritance in nginx).
        include /etc/nginx/nginx.security-headers.conf;

        # PWA-Icons + Favicon: Admin-Upload generiert Runtime-Varianten in
        # /content/assets/, die hier Vorrang vor dem Build-Default bekommen.
        # Exact match schlaegt die generische Asset-Regex-Location unten.
        location = /assets/favicon.png {
            try_files /content$uri $uri =404;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }
        location = /assets/icon-144.png {
            try_files /content$uri $uri =404;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }
        location = /assets/icon-192.png {
            try_files /content$uri $uri =404;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }
        location = /assets/icon-512.png {
            try_files /content$uri $uri =404;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }

        # Aggressive caching for hashed assets (immutable URLs)
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/nginx.security-headers.conf;
        }

        # JSON Files - cache for 1 hour by default
        location ~* \.json$ {
            add_header Content-Type application/json;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            include /etc/nginx/nginx.security-headers.conf;
        }

        # Runtime manifests must always be fresh so rehashed JSON files resolve immediately
        location = /assets-hashes.json {
            add_header Content-Type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }

        # Content volume: admin-edited JSONs, sponsor logos, floorplan image,
        # hash manifest + sw-version. `^~` beats the regex-based image cache
        # below so Grafiken hier NICHT mit `expires 1y` landen. Nested
        # regex-locations inside sind noetig, weil `^~` die aeusseren
        # Regex-Deny-Regeln (fuer /\. und .backup) sonst kurzschliesst.
        location ^~ /content/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires 0;
            include /etc/nginx/nginx.security-headers.conf;

            # Branding-Assets (Logo, Floorplan, Sponsor-Logos, custom.css):
            # selten geaendert, aber admin-editierbar. Kurzer Browser-Cache
            # mit must-revalidate verhindert das Logo-Flackern beim Seiten-
            # wechsel, Aenderungen schlagen nach max. 1h durch (bzw. sofort,
            # sobald der Admin-Upload einen neuen Last-Modified setzt und
            # der Browser revalidiert).
            location ^~ /content/assets/ {
                # `expires off` ist noetig, sonst erbt diese Location das
                # `expires 0;` der aeusseren `^~ /content/` und nginx
                # schickt ZUSAETZLICH ein `Cache-Control: max-age=0`, das
                # unseren `max-age=3600`-Header neutralisiert.
                expires off;
                add_header Cache-Control "public, max-age=3600, must-revalidate";
                include /etc/nginx/nginx.security-headers.conf;
                try_files $uri =404;
            }

            location ~ /\. {
                return 404;
                access_log off;
                log_not_found off;
            }

            location ~ \.backup$ {
                return 404;
                access_log off;
                log_not_found off;
            }

            # votes.json enthaelt User-Tracking — Clients bekommen die
            # aggregierte Sicht ueber /votes/status.php, die Rohdatei bleibt
            # intern.
            location = /content/voting/votes.json {
                return 404;
                access_log off;
                log_not_found off;
            }

            try_files $uri =404;
        }

        # PWA manifest should not sit behind a long browser cache
        location = /manifest.json {
            add_header Content-Type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }

        # Service Worker - no cache (must always be fresh)
        location = /sw.js {
            add_header Content-Type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Service-Worker-Allowed "/";
            include /etc/nginx/nginx.security-headers.conf;
        }

        # HTML files - network-first strategy
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }

        # Admin panel - rewrite directory URL to index.php for PHP-FPM
        location = /admin/ {
            rewrite ^(.*)$ /admin/index.php last;
        }

        # SPA Fallback (for all other routes) — Root-Route liefert PHP-gerenderten
        # Head aus event.json, damit Crawler/Social-Previews echte Werte sehen.
        location / {
            try_files $uri $uri/ /index.php;
        }

        # Deny access to hidden files and backup artifacts
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ \.backup$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # PHP files (for votes system)
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            # Disable caching for PHP responses
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/nginx.security-headers.conf;
        }
    }
}
