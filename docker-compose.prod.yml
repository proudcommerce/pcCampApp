services:
  pccampapp-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pccampapp-prod
    ports:
      - "${PROD_PORT:-5174}:5173"
    environment:
      - VOTING_ADMIN_KEY=${VOTING_ADMIN_KEY}
    volumes:
      # Code kommt komplett aus dem Image.
      # Nur der laufzeit-aenderbare Content wird vom Host gemountet.
      - ./content:/usr/share/nginx/html/content:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - pccampapp-prod-network

networks:
  pccampapp-prod-network:
    driver: bridge
